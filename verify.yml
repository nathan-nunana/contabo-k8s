- name: Smoke-test the cluster
  hosts: all
  become: true
  tasks:
    - name: Node is Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=60s
      changed_when: false

    - name: No pods are stuck or failing
      ansible.builtin.command: >
        k3s kubectl get pods -A -o name
        --field-selector=status.phase!=Running,status.phase!=Succeeded
      register: unhealthy_pods
      changed_when: false
      retries: 20
      delay: 15
      until: unhealthy_pods.stdout | length == 0

    # Through the API server's service proxy: the Prometheus image is distroless,
    # so there is no wget or curl to exec inside it.
    - name: Read Prometheus scrape targets
      ansible.builtin.command: >
        k3s kubectl get --raw
        /api/v1/namespaces/monitoring/services/kube-prometheus-stack-prometheus:http-web/proxy/api/v1/targets?state=active
      register: prometheus_targets
      changed_when: false

    - name: Every scrape target is up, including Traefik and cert-manager
      vars:
        targets: "{{ (prometheus_targets.stdout | from_json).data.activeTargets }}"
        jobs: "{{ targets | map(attribute='labels.job') | unique }}"
        down: "{{ targets | rejectattr('health', 'equalto', 'up') | map(attribute='scrapeUrl') | list }}"
      ansible.builtin.assert:
        that:
          - down | length == 0
          - "'cert-manager' in jobs"
          - jobs | select('search', 'traefik') | list | length > 0
        fail_msg: "Down: {{ down }}. Jobs found: {{ jobs }}"
        quiet: true

    - name: Grafana certificate is issued
      ansible.builtin.command: >
        k3s kubectl -n monitoring wait certificate/grafana-tls
        --for=condition=Ready --timeout=300s
      changed_when: false

    - name: Grafana answers over HTTPS
      ansible.builtin.uri:
        url: "https://{{ grafana_host }}/api/health"
        validate_certs: "{{ cluster_issuer == 'letsencrypt-prod' }}"
      delegate_to: localhost
      become: false

    - name: Plain HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: "http://{{ grafana_host }}/"
        follow_redirects: none
        status_code: [301, 308]
      register: http_redirect
      failed_when: not http_redirect.location.startswith('https://')
      delegate_to: localhost
      become: false

- name: Check platform tenants
  hosts: all
  become: true
  gather_facts: true
  vars:
    platform_pg_tenants: "{{ tenants | selectattr('postgres', 'defined') | selectattr('postgres') | list }}"
  tasks:
    - name: Postgres cluster is Ready
      ansible.builtin.command: k3s kubectl -n databases wait cluster/postgres --for=condition=Ready --timeout=60s
      changed_when: false

    - name: Try Postgres from an unlabelled namespace
      ansible.builtin.include_tasks: tests/check-pod.yml
      vars:
        verify_pod_namespace: default
        verify_pod_name: netpol-check
        verify_pod_spec:
          containers:
            - name: netpol-check
              image: "{{ postgres_image }}"
              # Wait past the first seconds, when new pods have no network yet
              # anyway, so a pass means the policy blocked it.
              command: [bash, -c, "sleep 10; pg_isready -h postgres-rw.databases.svc -t 5"]

    - name: Postgres refuses connections from unlabelled namespaces
      ansible.builtin.assert:
        that: "'no response' in verify_pod_logs.stdout"
        fail_msg: "Expected no response, got: {{ verify_pod_logs.stdout }}"
        quiet: true

    - name: MinIO is ready
      ansible.builtin.command: k3s kubectl -n storage rollout status statefulset/minio --timeout=60s
      changed_when: false

    # Straight to the VPS with the assets hostname, so this doesn't depend on
    # DNS. -k because the certificate may not be issued yet.
    - name: Send GET and PUT to the assets host
      ansible.builtin.command:
        argv: [curl, -sk, -o, /dev/stdout, -w, "\nstatus=%{http_code}", -X, "{{ item }}",
               --resolve, "{{ assets_host }}:443:{{ ansible_host }}",
               "https://{{ assets_host }}/no-such-bucket/probe.txt"]
      loop: [GET, PUT]
      register: verify_assets
      changed_when: false
      delegate_to: localhost
      become: false

    - name: GET reaches MinIO and PUT is refused before it
      ansible.builtin.assert:
        that:
          - "'<Error><Code>' in verify_assets.results[0].stdout"
          - "'status=404' in verify_assets.results[1].stdout"
          - "'404 page not found' in verify_assets.results[1].stdout"
        fail_msg: "GET: {{ verify_assets.results[0].stdout }} / PUT: {{ verify_assets.results[1].stdout }}"
        quiet: true

    - name: Run a database dump now
      ansible.builtin.command: >-
        k3s kubectl -n databases create job --from=cronjob/pg-dump
        pg-dump-verify-{{ ansible_date_time.epoch }}
      changed_when: true

    - name: Wait for the dump job pg-dump-verify-{{ ansible_date_time.epoch }}
      ansible.builtin.command: >-
        k3s kubectl -n databases wait --for=condition=complete --timeout=5m
        job/pg-dump-verify-{{ ansible_date_time.epoch }}
      changed_when: false

    - name: Read the dump job output pg-dump-verify-{{ ansible_date_time.epoch }}
      ansible.builtin.command: k3s kubectl -n databases logs job/pg-dump-verify-{{ ansible_date_time.epoch }}
      register: verify_dump_logs
      changed_when: false

    - name: Every tenant database was dumped
      ansible.builtin.assert:
        that: "('dumped ' ~ (item.name | replace('-', '_'))) in verify_dump_logs.stdout"
        fail_msg: "{{ verify_dump_logs.stdout }}"
        quiet: true
      loop: "{{ platform_pg_tenants }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check each tenant
      ansible.builtin.include_tasks: tests/verify-tenant.yml
      loop: "{{ tenants }}"
      loop_control:
        loop_var: tenant
        label: "{{ tenant.name }}"
