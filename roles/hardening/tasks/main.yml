- name: Upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - python3-systemd
      - ufw
      - unattended-upgrades
    state: present

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash

- name: Authorize the admin SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_pubkey }}"
    exclusive: true

- name: Allow the admin user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ admin_user }}
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# Root and password logins are switched off below, so prove the new account
# works first. A failure here stops the play with SSH still open.
- name: Confirm the admin user can SSH in and sudo
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
    {{ '-i ' ~ ansible_ssh_private_key_file if ansible_ssh_private_key_file is defined else '' }}
    {{ admin_user }}@{{ ansible_host }} sudo -n true
  delegate_to: localhost
  become: false
  changed_when: false

# Named 00- so it wins over 50-cloud-init.conf, which Contabo images ship with
# PasswordAuthentication yes. sshd keeps the first value it reads.
- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Firewall | rate-limit SSH
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Firewall | allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Firewall | allow the Kubernetes API from admin networks
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ admin_cidrs }}"

- name: Firewall | allow pod and service networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop:
    - 10.42.0.0/16
    - 10.43.0.0/16

- name: Firewall | deny other inbound traffic and enable
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Configure the fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Raise inotify limits for Kubernetes workloads
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
  loop:
    - { name: fs.inotify.max_user_instances, value: "8192" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
