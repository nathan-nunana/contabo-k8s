- name: "Pull and app secrets for {{ tenant.name }}"
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: "{{ tenant.name }}-access"
    platform_template: tenant-access.yaml.j2
    platform_secret: true

- name: "Network isolation for {{ tenant.name }}"
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: "{{ tenant.name }}-network"
    platform_template: tenant-network.yaml.j2

- name: "Deploy account for {{ tenant.name }}"
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: "{{ tenant.name }}-deployer"
    platform_template: deployer.yaml.j2

- name: "Read the deploy token for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", get, secret, deployer-token, -o, "jsonpath={.data.token}"]
  register: platform_deployer_token
  changed_when: false
  retries: 10
  delay: 2
  until: platform_deployer_token.stdout | length > 0
  no_log: true

- name: "Read the cluster CA for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", get, secret, deployer-token, -o, "jsonpath={.data.ca\\.crt}"]
  register: platform_deployer_ca
  changed_when: false

- name: "Write the deploy kubeconfig to this workstation for {{ tenant.name }}"
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/deploy-kubeconfigs/{{ tenant.name }}.yaml"
    content: "{{ lookup('ansible.builtin.template', 'deployer-kubeconfig.yaml.j2') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: "Database credentials for {{ tenant.name }}"
  when: tenant.postgres | default(false)
  block:
    - name: "Read the role password for {{ tenant.name }}"
      ansible.builtin.include_tasks: password.yml
      vars:
        platform_pw_namespace: databases
        platform_pw_secret: "tenant-{{ tenant.name }}"
        platform_pw_key: password

    - name: "DATABASE_URL secret for {{ tenant.name }}"
      ansible.builtin.include_tasks: apply.yml
      vars:
        platform_manifest: "{{ tenant.name }}-postgres"
        platform_template: tenant-postgres.yaml.j2
        platform_secret: true

- name: "Bucket for {{ tenant.name }}"
  ansible.builtin.include_tasks: bucket.yml
  when: tenant.bucket is defined

- name: "Redis password for {{ tenant.name }}"
  ansible.builtin.include_tasks: password.yml
  vars:
    platform_pw_namespace: "{{ tenant.name }}"
    platform_pw_secret: redis-auth
    platform_pw_key: REDIS_PASSWORD

- name: "Redis for {{ tenant.name }}"
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: "{{ tenant.name }}-redis"
    platform_template: tenant-redis.yaml.j2
    platform_secret: true

- name: "Wait for Redis for {{ tenant.name }}"
  ansible.builtin.command: k3s kubectl -n {{ tenant.name }} rollout status statefulset/redis --timeout=3m
  changed_when: false
