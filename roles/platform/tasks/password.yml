# Reads a generated secret value back from the cluster, or makes a new one.
# Re-running never rotates an existing value.
- name: Read the existing value of {{ platform_pw_namespace ~ '/' ~ platform_pw_secret }}
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ platform_pw_namespace }}", get, secret, "{{ platform_pw_secret }}",
           -o, "jsonpath={.data.{{ platform_pw_key }}}"]
  register: platform_pw_existing
  changed_when: false
  failed_when: false
  no_log: true

- name: Keep the existing value or generate one
  ansible.builtin.set_fact:
    platform_password: >-
      {{ platform_pw_existing.stdout | b64decode
         if platform_pw_existing.rc == 0 and platform_pw_existing.stdout | length > 0
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}
  no_log: true
