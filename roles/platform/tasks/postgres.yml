- name: Install the CloudNativePG operator
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cloudnative-pg
    chart_repo_url: https://cloudnative-pg.github.io/charts
    chart_version: "{{ cnpg_chart_version }}"
    release_namespace: cnpg-system
    create_namespace: true
    wait: true

- name: Backup role password
  ansible.builtin.include_tasks: password.yml
  vars:
    platform_pw_namespace: databases
    platform_pw_secret: backup-credentials
    platform_pw_key: password

- name: Backup role secret
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: postgres-role-backup
    platform_template: postgres-role-secret.yaml.j2
    platform_role_secret: backup-credentials
    platform_role_name: backup
    platform_secret: true

- name: Tenant role secrets
  ansible.builtin.include_tasks: postgres_role.yml
  loop: "{{ platform_pg_tenants }}"
  loop_control:
    loop_var: tenant
    label: "{{ tenant.name }}"

- name: Postgres cluster, network policy and monitoring
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: postgres

- name: Wait for Postgres to be Ready
  ansible.builtin.command: k3s kubectl -n databases wait cluster/postgres --for=condition=Ready --timeout=10m
  changed_when: false

- name: Tenant databases
  ansible.builtin.include_tasks: apply.yml
  vars:
    platform_manifest: postgres-databases

- name: Wait for each tenant database
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, databases, wait, "database/{{ item.name }}",
           "--for=jsonpath={.status.applied}=true", --timeout=2m]
  loop: "{{ platform_pg_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Find the Postgres primary
  ansible.builtin.command: >-
    k3s kubectl -n databases get pod -l cnpg.io/cluster=postgres,cnpg.io/instanceRole=primary
    -o jsonpath={.items[0].metadata.name}
  register: platform_pg_primary
  changed_when: false

# New databases let PUBLIC connect; limit each to its owner and the backup role.
- name: Restrict who can connect to each tenant database
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - -n
      - databases
      - exec
      - "{{ platform_pg_primary.stdout }}"
      - -c
      - postgres
      - --
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        REVOKE CONNECT ON DATABASE "{{ item.name | replace('-', '_') }}" FROM PUBLIC;
        GRANT CONNECT ON DATABASE "{{ item.name | replace('-', '_') }}"
        TO "{{ item.name | replace('-', '_') }}", backup;
  loop: "{{ platform_pg_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
