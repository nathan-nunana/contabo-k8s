- name: Render {{ platform_manifest }}
  ansible.builtin.template:
    src: "{{ platform_template | default(platform_manifest ~ '.yaml.j2') }}"
    dest: "{{ platform_manifest_dir }}/{{ platform_manifest }}.yaml"
    mode: "0600"
  no_log: "{{ platform_secret | default(false) }}"

# `kubectl apply` says "configured" for every Secret written with stringData,
# even when nothing changes, so compare with `kubectl diff` first: exit 0 means
# the cluster already matches, 1 means it differs.
- name: Compare {{ platform_manifest }} with the cluster
  ansible.builtin.command: k3s kubectl diff -f {{ platform_manifest_dir }}/{{ platform_manifest }}.yaml
  register: platform_diff
  changed_when: platform_diff.rc == 1
  failed_when: platform_diff.rc > 1
  no_log: "{{ platform_secret | default(false) }}"

- name: Apply {{ platform_manifest }}
  ansible.builtin.command: k3s kubectl apply -f {{ platform_manifest_dir }}/{{ platform_manifest }}.yaml
  when: platform_diff.rc == 1
  changed_when: true
