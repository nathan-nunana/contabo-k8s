- name: "Deployer cannot read Secrets for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, auth, can-i, get, secrets, -n, "{{ tenant.name }}",
           "--as=system:serviceaccount:{{ tenant.name }}:deployer"]
  register: verify_can_read_secrets
  changed_when: false
  failed_when: verify_can_read_secrets.stdout != 'no'

- name: "Deployer can deploy for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, auth, can-i, "{{ item.verb }}", "{{ item.resource }}", -n, "{{ tenant.name }}",
           "--as=system:serviceaccount:{{ tenant.name }}:deployer"]
  loop:
    - { verb: create, resource: jobs.batch }
    - { verb: patch, resource: deployments.apps }
    - { verb: create, resource: middlewares.traefik.io }
  loop_control:
    label: "{{ item.verb }} {{ item.resource }}"
  register: verify_can_deploy
  changed_when: false
  failed_when: verify_can_deploy.stdout != 'yes'

- name: "Privileged pods are rejected for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", run, psa-check, --dry-run=server, --image=busybox:1.37,
           '--overrides={"spec":{"containers":[{"name":"psa-check","image":"busybox:1.37","securityContext":{"privileged":true}}]}}']
  register: verify_psa
  changed_when: false
  failed_when: verify_psa.rc == 0 or 'violates PodSecurity' not in verify_psa.stderr

- name: "Deployer cannot expose NodePort Services for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", create, service, nodeport, vap-check, --tcp=80:80, --dry-run=server,
           "--as=system:serviceaccount:{{ tenant.name }}:deployer"]
  register: verify_nodeport
  changed_when: false
  failed_when: verify_nodeport.rc == 0 or 'must be ClusterIP' not in verify_nodeport.stderr

- name: "Deployer cannot claim hosts it does not own for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", create, ingress, hijack-check, "--rule={{ item }}/*=x:80",
           --dry-run=server, "--as=system:serviceaccount:{{ tenant.name }}:deployer"]
  loop: "{{ [assets_host, grafana_host] + (tenants | rejectattr('name', 'equalto', tenant.name)
            | map(attribute='hosts', default=[]) | flatten) }}"
  register: verify_hijack
  changed_when: false
  failed_when: verify_hijack.rc == 0 or 'is not allowed in this namespace' not in verify_hijack.stderr

- name: "Deployer can use its own hosts for {{ tenant.name }}"
  ansible.builtin.command:
    argv: [k3s, kubectl, -n, "{{ tenant.name }}", create, ingress, own-host-check, "--rule={{ item }}/*=x:80",
           --dry-run=server, "--as=system:serviceaccount:{{ tenant.name }}:deployer"]
  loop: "{{ tenant.hosts | default([]) }}"
  changed_when: false

- name: "Database access for {{ tenant.name }}"
  when: tenant.postgres | default(false)
  block:
    - name: "Connect to own database and try the others for {{ tenant.name }}"
      ansible.builtin.include_tasks: check-pod.yml
      vars:
        verify_pod_namespace: "{{ tenant.name }}"
        verify_pod_name: pg-check
        verify_others: "{{ platform_pg_tenants | map(attribute='name') | reject('equalto', tenant.name)
                           | map('replace', '-', '_') | join(' ') }}"
        verify_pod_spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-check
              image: "{{ postgres_image }}"
              envFrom: [{ secretRef: { name: postgres } }]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              command: [/bin/bash, -c]
              args:
                - |
                  # New pods get network access a couple of seconds after start.
                  for i in $(seq 1 30); do pg_isready -q -h postgres-rw.databases.svc && break; sleep 1; done
                  echo "own=$(psql "$DATABASE_URL" -tAc 'select current_database()')"
                  for db in {{ verify_others }}; do
                    if out=$(psql "${DATABASE_URL%/*}/$db?sslmode=require" -tAc 'select 1' 2>&1); then
                      echo "cross=$db:allowed"
                    elif echo "$out" | grep -q 'permission denied for database'; then
                      echo "cross=$db:denied"
                    else
                      echo "cross=$db:error: $out"
                    fi
                  done

    - name: "Only its own database is reachable for {{ tenant.name }}"
      ansible.builtin.assert:
        that:
          - ('own=' ~ (tenant.name | replace('-', '_'))) in verify_pod_logs.stdout
          - "':allowed' not in verify_pod_logs.stdout"
          - "':error' not in verify_pod_logs.stdout"
        fail_msg: "{{ verify_pod_logs.stdout }}"
        quiet: true

- name: "Bucket access for {{ tenant.name }}"
  when: tenant.bucket is defined
  block:
    - name: "Write own bucket and try the others for {{ tenant.name }}"
      ansible.builtin.include_tasks: check-pod.yml
      vars:
        verify_pod_namespace: "{{ tenant.name }}"
        verify_pod_name: s3-check
        verify_others: "{{ tenants | selectattr('bucket', 'defined') | map(attribute='name')
                           | reject('equalto', tenant.name) | join(' ') }}"
        verify_pod_spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: s3-check
              image: "{{ minio_image }}"
              envFrom: [{ secretRef: { name: storage } }]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              command: [/bin/sh, -c]
              args:
                - |
                  export MC_CONFIG_DIR=/tmp/.mc MC_HOST_t="http://$ACCESS_KEY:$SECRET_KEY@$ENDPOINT"
                  # New pods get network access a couple of seconds after start.
                  for i in $(seq 1 30); do curl -sf "http://$ENDPOINT/minio/health/live" && break; sleep 1; done
                  echo ok > /tmp/probe.txt
                  if mc cp -q /tmp/probe.txt "t/$BUCKET/verify/probe.txt" >/dev/null
                  then echo own=write-ok; else echo own=write-failed; fi
                  for b in {{ verify_others }}; do
                    # The image has no grep, so match with case.
                    if out=$(mc cp -q /tmp/probe.txt "t/$b/verify/probe.txt" 2>&1); then
                      echo "cross=$b:allowed"
                    else
                      case "$out" in
                        *"Insufficient permissions"*|*"Access Denied"*) echo "cross=$b:denied" ;;
                        *) echo "cross=$b:error: $out" ;;
                      esac
                    fi
                  done

    - name: "Only its own bucket is writable for {{ tenant.name }}"
      ansible.builtin.assert:
        that:
          - "'own=write-ok' in verify_pod_logs.stdout"
          - "':allowed' not in verify_pod_logs.stdout"
          - "':error' not in verify_pod_logs.stdout"
        fail_msg: "{{ verify_pod_logs.stdout }}"
        quiet: true

    - name: "Public files are readable on the assets host for {{ tenant.name }}"
      when: tenant.bucket == 'public-read'
      ansible.builtin.command:
        argv: [curl, -sk, --resolve, "{{ assets_host }}:443:{{ ansible_host }}",
               "https://{{ assets_host }}/{{ tenant.name }}/verify/probe.txt"]
      register: verify_public
      changed_when: false
      failed_when: verify_public.stdout | trim != 'ok'
      delegate_to: localhost
      become: false
